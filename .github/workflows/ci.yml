name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Lint, test and build the Swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: brew install swiftlint
      - run: swiftlint lint --quiet --strict
      - run: swift test
      - run: xcodebuild -scheme HotCodePushProtocol -destination 'generic/platform=iOS Simulator' -quiet build
