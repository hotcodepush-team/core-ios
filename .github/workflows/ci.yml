name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Lint, test and build the Swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compare the bspatch sources with core-android's
        run: for file in bspatch.c include/HotCodePushBspatch.h; do curl -fsSL "https://raw.githubusercontent.com/hotcodepush-team/core-android/main/src/main/cpp/bspatch/$file" | cmp - "Sources/HotCodePushBspatch/$file"; done
      - run: brew install swiftlint
      - run: swiftlint lint --quiet --strict
      - run: swift test
      - run: xcodebuild -scheme HotCodePushCore -destination 'generic/platform=iOS Simulator' -quiet build

  xcframework:
    name: Build the XCFramework
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 26.0.1
      - run: scripts/build-xcframework.sh 0.0.0 "$RUNNER_TEMP/xcframework"
